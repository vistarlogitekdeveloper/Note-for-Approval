name: note_approval
description: "Vistar Note for Approval Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Fonts & icons
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.19.0

  # PDF / Print
  pdf: ^3.11.1
  printing: ^5.13.4

  # Persistence
  shared_preferences: ^2.3.3

  # UUID
  uuid: ^4.5.1

  # File upload
  file_picker: ^8.1.4

  # HTTP client
  dio: ^5.7.0

  # Browser download of PDFs/attachments. Both endpoints need the Bearer
  # token, so the bytes come through Dio and are saved via a Blob — see
  # core/utils/file_download_web.dart. Declared directly rather than leaned on
  # as a transitive dependency.
  web: ^1.1.0

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # Excel export (admin reports)
  excel: ^4.0.6

  # Dotted border
  dotted_border: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

  # Build-time only, for tool/prepare_logos.dart — keys the backdrop out of the
  # source logos and emits the sizes the design system uses. Deliberately a dev
  # dependency so it never ships in the app bundle.
  image: ^4.3.0

flutter:
  uses-material-design: true

  # Only the prepared marks are bundled. The 2 MB `logo.png` / `logo_name.png`
  # sources stay in the repo for regeneration (tool/prepare_logos.dart) but are
  # deliberately NOT listed — shipping them would add ~4 MB to the web payload
  # for pixels that are 89% transparent margin.
  assets:
    - assets/images/mark.png
    - assets/images/mark_sm.png
    - assets/images/wordmark.png

flutter_launcher_icons:
  image_path: "icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: false
