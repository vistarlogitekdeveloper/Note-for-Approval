# Sized to build on an ordinary PC (~8 GB RAM), not just a CI box. The old
# -Xmx8G + 4G metaspace asked for ~12 GB for the Gradle JVM alone; with the
# Kotlin daemon on top it exceeded physical RAM and the JVM crashed mid-compile
# (see the android/hs_err_pid*.log dumps), which is what corrupted the Kotlin
# incremental caches. 4 GB is ample for this app; the Kotlin daemon is capped
# separately below so the two JVMs together stay within a normal machine.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
